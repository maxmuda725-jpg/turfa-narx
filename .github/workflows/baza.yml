name: Bazani Billz'dan yangilash
on:
  schedule:
    - cron: '17 * * * *'   # har soatda
  workflow_dispatch:
permissions:
  contents: write
concurrency: baza
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Billz'dan yuklash
        env:
          BILLZ_SECRET_TOKEN: ${{ secrets.BILLZ_SECRET_TOKEN }}
        run: |
          if [ -z "$BILLZ_SECRET_TOKEN" ]; then echo "BILLZ_SECRET_TOKEN qo'shilmagan"; exit 0; fi
          python3 scripts/billz_sync.py
      - name: Saqlash
        run: |
          git config user.name "baza-bot"; git config user.email "baza-bot@users.noreply.github.com"
          git add baza/products.csv
          git diff --cached --quiet && echo "O'zgarish yo'q" || (git commit -m "Baza Billz'dan yangilandi" && git push)
