name: Bazani Billz'dan yangilash
on:
  schedule:
    - cron: '17 * * * *'   # har soatda
  workflow_dispatch:
permissions:
  contents: write
concurrency: baza
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ilova rasmlarini GitHub'ga ko'chirish (bepul saqlash)
        continue-on-error: true
        env:
          RASM_KEY: ${{ secrets.RASM_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/rasm_arxiv.py
      - name: Billz'dan yuklash
        env:
          BILLZ_SECRET_TOKEN: ${{ secrets.BILLZ_SECRET_TOKEN }}
        run: |
          if [ -z "$BILLZ_SECRET_TOKEN" ]; then echo "BILLZ_SECRET_TOKEN qo'shilmagan"; exit 0; fi
          python3 scripts/billz_sync.py
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Rasm vektorlari (rasm orqali qidirish uchun)
        continue-on-error: true
        run: |
          pip install -q "mediapipe==0.10.14" "numpy<2" pillow
          curl -fsSL -o embedder.tflite "$EMBED_URL"
          python3 scripts/embed.py
        env:
          EMBED_URL: https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/latest/mobilenet_v3_small.tflite
      - name: Saqlash
        run: |
          git config user.name "baza-bot"; git config user.email "baza-bot@users.noreply.github.com"
          git add baza/
          git diff --cached --quiet && echo "O'zgarish yo'q" || (git commit -m "Baza Billz'dan yangilandi" && git push)
