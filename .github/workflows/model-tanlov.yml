name: Rasm modellarini solishtirish
on:
  workflow_dispatch:
    inputs:
      diag: { default: 'no' }
permissions:
  contents: write
jobs:
  tanlov:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: O'rnatish
        run: |
          pip install -q "mediapipe==0.10.14" "numpy<2" pillow
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers
          curl -fsSL -o small.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/latest/mobilenet_v3_small.tflite
          curl -fsSL -o detector.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/int8/latest/efficientdet_lite0.tflite
          curl -fsSL -o magic.tflite https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/latest/magic_touch.tflite
          curl -fsSL -o large.tflite https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_large/float32/latest/mobilenet_v3_large.tflite
      - name: Solishtirish
        if: inputs.diag == 'no'
        run: python3 scripts/model_tanlov.py
      - name: Xatolar tahlili
        if: inputs.diag == 'yes'
        run: python3 scripts/model_tanlov.py --diag
      - name: Fonni olib tashlash sinovi
        if: inputs.diag == 'fon'
        run: python3 scripts/model_tanlov.py --fon
      - name: Natijani diag tarmog'iga
        if: inputs.diag != 'no'
        run: |
          cd diag && git init -q && git checkout -q -b diag && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm diag
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" diag
