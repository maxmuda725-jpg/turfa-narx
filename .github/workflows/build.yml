name: APK yig'ish
on:
  push:
    paths-ignore: ['baza/**', '*.md']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/*.apk TURFA-Narxlar.apk
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "v1.${{ github.run_number }}" TURFA-Narxlar.apk \
            --title "TUR-FA Narxlar v1.${{ github.run_number }}" \
            --notes "Yangi versiya. Yuklab olib o'rnating." --latest
