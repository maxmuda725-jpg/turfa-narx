name: APK yig'ish
on:
  push:
    paths-ignore: ['baza/**', '*.md', 'scripts/**', '.github/workflows/baza.yml', '.github/workflows/diag.yml', '.github/workflows/rasm_papka.yml', 'sinov/**', '.github/workflows/sinov.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Rasm modeli (rasm orqali qidirish)
        run: |
          mkdir -p app/src/main/assets
          cp baza/kategoriyalar.txt app/src/main/assets/kategoriyalar.txt
          curl -fsSL -o app/src/main/assets/embedder.tflite \
            https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/latest/mobilenet_v3_small.tflite
      - name: APK yig'ish
        env:
          RASM_KEY: ${{ secrets.RASM_KEY }}
          APP_VERSION: ${{ github.run_number }}
        run: |
          # Doimiy imzo kaliti (shifrlangan, RASM_KEY bilan ochiladi)
          K=$(python3 -c "import os;print(os.environ.get('RASM_KEY','').strip())")
          if [ -n "$K" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -in app/turfa.jks.enc -out app/turfa.jks -pass pass:"$K"
            export KS_PASS=$(python3 -c "import hashlib,sys;print(hashlib.sha256(('ks:'+sys.argv[1]).encode()).hexdigest()[:24])" "$K")
          fi
          # rasm_arxiv.py bilan bir xil: secret .strip() qilinadi (ko'rinmas bo'sh joylar ham)
          export RASM_APP_KEY=$(python3 -c "import os,hashlib;k=os.environ.get('RASM_KEY','').strip();print(hashlib.sha256(('turfa-app:'+k).encode()).hexdigest() if k else '')")
          gradle assembleRelease
      - run: cp app/build/outputs/apk/release/*.apk TURFA-Narxlar.apk
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with: { name: TURFA-Narxlar-sinov, path: TURFA-Narxlar.apk }
      - name: Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "v1.${{ github.run_number }}" TURFA-Narxlar.apk \
            --title "TUR-FA Narxlar v1.${{ github.run_number }}" \
            --notes "Yangi versiya. Yuklab olib o'rnating." --latest
