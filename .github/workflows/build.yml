name: APK yig'ish
on:
  push:
    paths-ignore: ['baza/**', '*.md', 'scripts/**', '.github/workflows/baza.yml', '.github/workflows/diag.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Rasm modeli (rasm orqali qidirish)
        run: |
          mkdir -p app/src/main/assets
          curl -fsSL -o app/src/main/assets/embedder.tflite \
            https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float32/latest/mobilenet_v3_small.tflite
      - run: gradle assembleRelease
      - run: cp app/build/outputs/apk/release/*.apk TURFA-Narxlar.apk
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with: { name: TURFA-Narxlar-sinov, path: TURFA-Narxlar.apk }
      - name: Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "v1.${{ github.run_number }}" TURFA-Narxlar.apk \
            --title "TUR-FA Narxlar v1.${{ github.run_number }}" \
            --notes "Yangi versiya. Yuklab olib o'rnating." --latest
